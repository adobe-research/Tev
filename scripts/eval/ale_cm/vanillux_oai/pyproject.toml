[project]
name = "ale-agent-vanillux-oai"
version = "0.1.0"
description = "Tev Vanillux2 (RL-training) harness as an ALE agent, over an OpenAI-compatible endpoint."
requires-python = ">=3.12,<3.14"
# Stdlib + ale_run.base_interface only — no extra deps.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = []
sources = {}
bypass-selection = true
