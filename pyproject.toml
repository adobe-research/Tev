[project]
name = "tev"
version = "0.1.0"
description = "Tev: Scaling Long-Horizon Agentic Environments with Dense Progress Rewards (Vanillux2 Harbor agent for evaluation)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "harbor==0.20.0",
    "litellm",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Vanillux2Agent"]

[tool.setuptools.package-data]
Vanillux2Agent = ["vanillux_prompts.yaml"]
